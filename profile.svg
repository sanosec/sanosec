      @keyframes promptClip0 { 
        0% { width: 0.0px; animation-timing-function: steps(19, jump-end); } 
        20% { width: 171.0px; animation-timing-function: steps(1, jump-end); } 
        40% { width: 171.0px; animation-timing-function: steps(19, jump-end); } 
        50% { width: 0.0px; animation-timing-function: steps(1, jump-end); } 
        100% { width: 0.0px; animation-timing-function: steps(1, jump-end); } 
      }
      
      @keyframes promptClip1 { 
        0% { width: 0.0px; animation-timing-function: steps(1, jump-end); } 
        50% { width: 0.0px; animation-timing-function: steps(21, jump-end); } 
        70% { width: 216.0px; animation-timing-function: steps(1, jump-end); } 
        90% { width: 216.0px; animation-timing-function: steps(21, jump-end); } 
        100% { width: 0.0px; animation-timing-function: steps(1, jump-end); } 
      }
      
      .promptClipRect0 { animation: promptClip0 8s infinite; }
      .promptClipRect1 { animation: promptClip1 8s infinite; }
      
      @keyframes promptCursorMove { 
        0% { transform: translateX(0.0px); animation-timing-function: steps(19, jump-end); } 
        20% { transform: translateX(171.0px); animation-timing-function: steps(1, jump-end); } 
        40% { transform: translateX(171.0px); animation-timing-function: steps(19, jump-end); } 
        50% { transform: translateX(0.0px); animation-timing-function: steps(21, jump-end); } 
        70% { transform: translateX(216.0px); animation-timing-function: steps(1, jump-end); } 
        90% { transform: translateX(216.0px); animation-timing-function: steps(21, jump-end); } 
        100% { transform: translateX(0.0px); animation-timing-function: steps(1, jump-end); } 
      }
      
      .promptcursor { animation: promptCursorMove 8s infinite, blink 1s steps(1) infinite; }
      .fadein { animation-name: reveal; animation-duration: 0.35s; animation-fill-mode: forwards; animation-timing-function: steps(1); }
      .typewriter { animation-name: reveal; animation-duration: 0.4s; animation-fill-mode: forwards; animation-timing-function: steps(1); }
      .swatch { animation-name: revealSwatch; animation-duration: 0.35s; animation-fill-mode: forwards; animation-timing-function: steps(1); }
      @keyframes reveal { 0% { opacity: 0; } 1%, 100% { opacity: 1; } }
      @keyframes revealSwatch { 0% { opacity: 0; } 1%, 100% { opacity: 1; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
